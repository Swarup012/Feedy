services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL
    image: swarup325/faddy-frontend:latest
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
