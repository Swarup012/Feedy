name: Deploy Feedy Frontend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. Docker Buildx (multi-platform + cache support) ──────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── 3. Login to Docker Hub ──────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─── 4. Build & Push Docker image ────────────────────────────────────────
      # NEXT_PUBLIC_* vars MUST be baked in at build time (Next.js limitation).
      # We pass them as build-args from GitHub Secrets — no hardcoding needed.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${{ secrets.NEXT_PUBLIC_PADDLE_CLIENT_TOKEN }}
            BACKEND_URL=http://faddy-backend:3000
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/faddy-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/faddy-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/faddy-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/faddy-frontend:buildcache,mode=max

      # ─── 5. SSH into server and redeploy ─────────────────────────────────────
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/faddy-app

            echo "📦 Pulling latest images..."
            docker-compose pull frontend

            echo "🚀 Restarting frontend container..."
            docker-compose up -d frontend

            echo "🧹 Cleaning up unused images..."
            docker image prune -f

            echo "✅ Frontend deployed successfully!"

      # ─── 6. Quick smoke-test ─────────────────────────────────────────────────
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sleep 10
            cd ~/faddy-app
            echo "Checking container status..."
            docker-compose ps frontend | grep running || (echo "❌ Container not running!" && exit 1)
            echo "✅ Frontend is live!"
